name: Build Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pyinstaller --clean NightOwlUtilities.spec
      - name: Build update manifest
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $hash = (Get-FileHash dist/NightOwlUtilities.exe -Algorithm SHA256).Hash.ToLower()
          $manifest = [ordered]@{
            version = $version
            url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/NightOwlUtilities.exe"
            sha256 = $hash
          }
          $manifest | ConvertTo-Json | Set-Content latest.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/NightOwlUtilities.exe --generate-notes
      - name: Publish update manifest
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add latest.json
          git commit -m "Update manifest for ${{ github.ref_name }}"
          git push origin HEAD:main
